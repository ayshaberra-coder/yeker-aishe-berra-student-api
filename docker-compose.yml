name: yeker-aishe-berra-student-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: yeker-aishe-berra-postgres
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: student
      POSTGRES_PASSWORD: ${DB_PASSWORD:-student_pass}
    volumes:
      - yeker_pgdata:/var/lib/postgresql/data
    networks:
      - yeker-net
    healthcheck:
      test: pg_isready -U student -d studentdb
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: yeker-aishe-berra-student-api:${APP_VERSION:-v1.0-37162}
    container_name: yeker-aishe-berra-container
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studentdb
      SPRING_DATASOURCE_USERNAME: student
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-student_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8095:8080"
    networks:
      - yeker-net

volumes:
  yeker_pgdata:

networks:
  yeker-net:
